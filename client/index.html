<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Master — Login</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="logo-row">
        <div class="logo">🎓</div>
        <h1>Quiz <span class="gold">Master</span></h1>
        <p class="sub">AI-powered examination platform</p>
      </div>

      <!-- Login form -->
      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="email" placeholder="you@school.com">
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••">
        </div>
        <button type="submit" class="btn block" id="login-btn">Sign In</button>
        <p style="text-align:center;margin-top:14px;font-size:.85rem">
          <a href="#" id="show-forgot">Forgot password?</a>
        </p>
        <p style="text-align:center;margin-top:6px;font-size:.85rem">
          New student? <a href="#" id="show-register">Create an account</a>
        </p>
      </form>

      <!-- Student registration form -->
      <form id="register-form" style="display:none">
        <div class="form-group">
          <label for="r-name">Full name</label>
          <input type="text" id="r-name" required placeholder="Your full name">
        </div>
        <div class="form-group">
          <label for="r-email">Email</label>
          <input type="email" id="r-email" required placeholder="you@school.com">
        </div>
        <div class="form-group">
          <label for="r-class">Class</label>
          <select id="r-class" required><option value="">Loading classes…</option></select>
        </div>
        <div class="form-group">
          <label for="r-reg">Registration / index number <span style="opacity:.6">(optional)</span></label>
          <input type="text" id="r-reg" placeholder="e.g. STU2026001">
        </div>
        <div class="form-group">
          <label for="r-password">Password</label>
          <input type="password" id="r-password" required placeholder="At least 6 characters">
        </div>
        <button type="submit" class="btn block" id="register-btn">Create Account</button>
        <p style="text-align:center;margin-top:14px;font-size:.85rem">
          <a href="#" id="show-login-2">← Back to login</a>
        </p>
      </form>

      <!-- Forgot password form -->
      <form id="forgot-form" style="display:none">
        <div class="form-group">
          <label for="f-email">Email</label>
          <input type="email" id="f-email" required placeholder="you@school.com">
        </div>
        <button type="submit" class="btn block">Request Reset Token</button>
        <div class="form-group" style="margin-top:18px">
          <label for="f-token">Reset token</label>
          <input type="text" id="f-token" placeholder="Paste your reset token">
        </div>
        <div class="form-group">
          <label for="f-newpass">New password</label>
          <input type="password" id="f-newpass" placeholder="At least 6 characters">
        </div>
        <button type="button" class="btn success block" id="do-reset">Reset Password</button>
        <p style="text-align:center;margin-top:14px;font-size:.85rem">
          <a href="#" id="show-login">← Back to login</a>
        </p>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.2/dist/axios.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
