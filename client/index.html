<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Master — Login</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="logo-row">
        <div class="logo"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10 12 5 2 10l10 5 10-5z"/><path d="M6 12v5c0 1 2.7 3 6 3s6-2 6-3v-5"/></svg></div>
        <h1>Quiz <span class="gold">Master</span></h1>
        <p class="sub">AI-powered examination platform</p>
      </div>

      <!-- Login form -->
      <form id="login-form">
        <div class="field">
          <span class="field-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg></span>
          <input type="email" id="email" required autocomplete="email" placeholder="Email address">
        </div>
        <div class="field">
          <span class="field-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
          <input type="password" id="password" required autocomplete="current-password" placeholder="Password">
          <button type="button" class="field-toggle" data-target="password">Show</button>
        </div>
        <button type="submit" class="btn block auth-btn" id="login-btn">Sign In</button>
        <div class="auth-links">
          <a href="#" id="show-forgot">Forgot password?</a>
          <span>New student? <a href="#" id="show-register">Create an account</a></span>
        </div>
      </form>

      <!-- Student registration form -->
      <form id="register-form" style="display:none">
        <div class="field">
          <span class="field-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></span>
          <input type="text" id="r-name" required placeholder="Full name">
        </div>
        <div class="field">
          <span class="field-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg></span>
          <input type="email" id="r-email" required placeholder="Email address">
        </div>
        <div class="field">
          <span class="field-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21h18"/><path d="M5 21V8l7-4 7 4v13"/><path d="M9 21v-6h6v6"/></svg></span>
          <select id="r-class" required><option value="">Select your class…</option></select>
        </div>
        <div class="field">
          <span class="field-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 9a3 3 0 0 1 0 6v2a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-2a3 3 0 0 1 0-6V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2z"/><path d="M13 5v2M13 17v2M13 11v2"/></svg></span>
          <input type="text" id="r-reg" placeholder="Registration / index number (optional)">
        </div>
        <div class="field">
          <span class="field-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
          <input type="password" id="r-password" required placeholder="Password (min 6)">
          <button type="button" class="field-toggle" data-target="r-password">Show</button>
        </div>
        <button type="submit" class="btn block auth-btn" id="register-btn">Create Account</button>
        <div class="auth-links"><a href="#" id="show-login-2">Back to login</a></div>
      </form>

      <!-- Forgot password form -->
      <form id="forgot-form" style="display:none">
        <div class="field">
          <span class="field-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 6-10 7L2 6"/></svg></span>
          <input type="email" id="f-email" required placeholder="Email address">
        </div>
        <button type="submit" class="btn block auth-btn">Request Reset Token</button>
        <div class="auth-divider">then reset</div>
        <div class="field">
          <span class="field-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="7.5" cy="15.5" r="4.5"/><path d="m10.7 12.3 8.3-8.3 2 2-2 2 2 2-2.5 2.5-2-2-2 2z"/></svg></span>
          <input type="text" id="f-token" placeholder="Paste your reset token">
        </div>
        <div class="field">
          <span class="field-icon"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
          <input type="password" id="f-newpass" placeholder="New password (min 6 characters)">
          <button type="button" class="field-toggle" data-target="f-newpass">Show</button>
        </div>
        <button type="button" class="btn success block auth-btn" id="do-reset">Reset Password</button>
        <div class="auth-links"><a href="#" id="show-login">Back to login</a></div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.2/dist/axios.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
