<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Master — Login</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="logo-row">
        <div class="logo">🎓</div>
        <h1>Quiz <span class="gold">Master</span></h1>
        <p class="sub">AI-powered examination platform</p>
      </div>

      <!-- Login form -->
      <form id="login-form">
        <div class="field">
          <span class="field-icon">✉️</span>
          <input type="email" id="email" required autocomplete="email" placeholder="Email address">
        </div>
        <div class="field">
          <span class="field-icon">🔒</span>
          <input type="password" id="password" required autocomplete="current-password" placeholder="Password">
          <button type="button" class="field-toggle" data-target="password">Show</button>
        </div>
        <button type="submit" class="btn block auth-btn" id="login-btn">Sign In</button>
        <div class="auth-links">
          <a href="#" id="show-forgot">Forgot password?</a>
          <span>New student? <a href="#" id="show-register">Create an account</a></span>
        </div>
      </form>

      <!-- Student registration form -->
      <form id="register-form" style="display:none">
        <div class="field">
          <span class="field-icon">👤</span>
          <input type="text" id="r-name" required placeholder="Full name">
        </div>
        <div class="field">
          <span class="field-icon">✉️</span>
          <input type="email" id="r-email" required placeholder="Email address">
        </div>
        <div class="field">
          <span class="field-icon">🏫</span>
          <select id="r-class" required><option value="">Select your class…</option></select>
        </div>
        <div class="field">
          <span class="field-icon">🎫</span>
          <input type="text" id="r-reg" placeholder="Registration / index number (optional)">
        </div>
        <div class="field">
          <span class="field-icon">🔒</span>
          <input type="password" id="r-password" required placeholder="Password (min 6)">
          <button type="button" class="field-toggle" data-target="r-password">Show</button>
        </div>
        <button type="submit" class="btn block auth-btn" id="register-btn">Create Account</button>
        <div class="auth-links"><a href="#" id="show-login-2">← Back to login</a></div>
      </form>

      <!-- Forgot password form -->
      <form id="forgot-form" style="display:none">
        <div class="field">
          <span class="field-icon">✉️</span>
          <input type="email" id="f-email" required placeholder="Email address">
        </div>
        <button type="submit" class="btn block auth-btn">Request Reset Token</button>
        <div class="auth-divider">then reset</div>
        <div class="field">
          <span class="field-icon">🔑</span>
          <input type="text" id="f-token" placeholder="Paste your reset token">
        </div>
        <div class="field">
          <span class="field-icon">🔒</span>
          <input type="password" id="f-newpass" placeholder="New password (min 6 characters)">
          <button type="button" class="field-toggle" data-target="f-newpass">Show</button>
        </div>
        <button type="button" class="btn success block auth-btn" id="do-reset">Reset Password</button>
        <div class="auth-links"><a href="#" id="show-login">← Back to login</a></div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/axios@1.7.2/dist/axios.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
